name: Bug report
description: Something behaves differently from what the documentation says
labels: ['needs-triage']

body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time. The fields below are the ones that decide
        whether a report can be acted on — the supported tier most of all, since
        it separates a defect from a combination nothing tests.

  - type: dropdown
    id: tier
    attributes:
      label: Which tier are you on?
      description: See [What is supported](https://github.com/igstudija/chapter-web#what-is-supported).
      options:
        - Tier 1 — Supabase and Vercel
        - Tier 2 — another Postgres, on Docker or bare Node
        - Tier 3 — another object storage (storage seam reimplemented)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Where is it running?
      options:
        - Local development (pnpm dev)
        - Vercel
        - Docker
        - Bare Node on my own server
        - Somewhere else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which version?
      description: The commit you are on — `git rev-parse --short HEAD`.
      placeholder: e.g. a0fb53b
    validations:
      required: true

  - type: input
    id: storage
    attributes:
      label: Which object storage?
      description: >-
        Only if the problem touches uploads, images or thumbnails. Supabase
        Storage is what the code ships against.
      placeholder: e.g. Supabase Storage, or Cloudflare R2 via a reimplemented seam

  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
      description: >-
        If the documentation led you to expect it, quoting the line helps — the
        documentation being wrong is itself a bug worth fixing.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The commands you ran, in order, starting from a state you can describe.
      placeholder: |
        1. pnpm migrate
        2. pnpm bootstrap
        3. Opened http://localhost:3050/…
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: Output of `pnpm diagnose`
      description: >-
        Redact nothing except the connection string password — the rest is what
        tells us whether the infrastructure or the software is at fault.
      render: text

  - type: input
    id: node
    attributes:
      label: Node version
      description: '`node --version`'
      placeholder: e.g. v22.17.0
