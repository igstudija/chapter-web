name: Feature request
description: Something the software should do and does not
labels: ['needs-triage']

body:
  - type: markdown
    attributes:
      value: >-
        This project serves one organisation per install, and stays deliberately
        smaller than the platforms it replaces. The most useful thing you can
        describe is the problem — the shape of the solution is easier to argue
        about once that is clear.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: >-
        What are you or your members trying to do, and what makes it hard or
        impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What do you have in mind?
      description: Optional. A rough shape is fine; so is leaving this empty.

  - type: textarea
    id: workaround
    attributes:
      label: How are you handling it now?
      description: >-
        A workaround that is merely annoying and one that fails outright are
        different priorities.

  - type: dropdown
    id: scope
    attributes:
      label: Who does this serve?
      options:
        - My organisation specifically
        - Any organisation running this software
        - Not sure
    validations:
      required: true
