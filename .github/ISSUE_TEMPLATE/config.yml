# A blank box produces reports that need three round trips before triage can
# start. The forms ask for what decides whether something is actionable.
blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/igstudija/chapter-web/security/advisories/new
    about: >-
      Privately, never as a public issue. A public issue is a working exploit
      against every install that has not upgraded yet.

  - name: Installation trouble
    url: https://github.com/igstudija/chapter-web/blob/main/README.md#install
    about: >-
      Run `pnpm diagnose` first — it separates most configuration mistakes from
      defects, and its output belongs in the report either way.
